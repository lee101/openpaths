<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <rect width="40" height="40" rx="8" fill="#000"/>
  <!-- top box -->
  <rect x="14" y="4" width="12" height="10" rx="2" stroke="#fff" stroke-width="2" fill="none"/>
  <!-- bottom-left box -->
  <rect x="2" y="26" width="12" height="10" rx="2" stroke="#fff" stroke-width="2" fill="none"/>
  <!-- bottom-right box -->
  <rect x="26" y="26" width="12" height="10" rx="2" stroke="#fff" stroke-width="2" fill="none"/>
  <!-- line from top to bottom-left -->
  <line x1="17" y1="14" x2="8" y2="26" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- line from top to bottom-right -->
  <line x1="23" y1="14" x2="32" y2="26" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
</svg>
