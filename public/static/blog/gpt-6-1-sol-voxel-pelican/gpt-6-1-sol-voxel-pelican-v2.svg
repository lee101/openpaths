<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">A voxel pelican riding a bicycle</title>
  <desc id="desc">An ivory pelican sits on a saddle above the rear wheel of a turquoise bicycle. Its visible wing rests over the frame, its bent legs reach the moving pedals, and its long orange beak extends over the forward handlebars. Two large dark voxel wheels spin above a tiled road bordered by grass.</desc>
