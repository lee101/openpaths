      .leaf2{--t:#aad1ab;--l:#79b28e;--r:#51967c}
      .wood{--t:#c9a37b;--l:#a17d5d;--r:#7d604d}
    </style>
    <g id="v" stroke="#243d43" stroke-opacity=".09" stroke-width=".6" stroke-linejoin="round">
