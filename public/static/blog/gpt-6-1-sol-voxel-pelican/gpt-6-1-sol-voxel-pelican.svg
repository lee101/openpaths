      <path d="M-8-4 0 0 0 9-8 5Z" fill="var(--l)"/>
      <path d="M0 0 8-4 8 5 0 9Z" fill="var(--r)"/>
    </g>
    <g id="tile" stroke="#526f71" stroke-opacity=".2" stroke-width=".7">
