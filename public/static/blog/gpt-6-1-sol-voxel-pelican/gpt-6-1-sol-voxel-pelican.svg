<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="800" viewBox="0 0 1000 800">
  <title>Voxel pelican riding a bicycle</title>
  <desc>An isometric, cube-built pelican pedals a turquoise bicycle across a tiled voxel road. The wheels spin, the crank turns, and the pelican gently bobs.</desc>
  <defs>
