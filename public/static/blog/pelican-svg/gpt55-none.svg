<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Animated SVG of a pelican riding a bicycle">
  <title>Pelican riding a bicycle</title>
  <defs>
    <style>
      .line{fill:none;stroke:#243447;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#243447;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .tire{fill:none;stroke:#1d2733;stroke-width:10}
      .rim{fill:none;stroke:#8aa0b4;stroke-width:4}
      .body{fill:#fff7dc;stroke:#243447;stroke-width:4}
      .wing{fill:#e8e0c9;stroke:#243447;stroke-width:4}
      .beak{fill:#f7b84b;stroke:#243447;stroke-width:4}
      .pouch{fill:#ffd88a;stroke:#243447;stroke-width:3}
      .leg{fill:none;stroke:#de8b2f;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .water{fill:none;stroke:#9ad7ff;stroke-width:5;stroke-linecap:round;opacity:.75}
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f7fcff"/>
  <path class="water" d="M40 365c45-22 82 22 126 0s82 22 126 0 82 22 126 0 82 22 126 0"/>
  <path class="water" d="M75 390c35-15 65 15 100 0s65 15 100 0 65 15 100 0 65 15 100 0"/>

  <g id="bike">
    <g transform="translate(182 292)">
      <circle class="tire" r="62"/>
      <circle class="rim" r="49"/>
      <g class="thin">
        <line x1="0" y1="-49" x2="0" y2="49"/>
        <line x1="-49" y1="0" x2="49" y2="0"/>
        <line x1="-35" y1="-35" x2="35" y2="35"/>
        <line x1="35" y1="-35" x2="-35" y2="35"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.15s" repeatCount="indefinite" additive="sum"/>
    </g>

    <g transform="translate(456 292)">
      <circle class="tire" r="62"/>
      <circle class="rim" r="49"/>
      <g class="thin">
        <line x1="0" y1="-49" x2="0" y2="49"/>
        <line x1="-49" y1="0" x2="49" y2="0"/>
        <line x1="-35" y1="-35" x2="35" y2="35"/>
        <line x1="35" y1="-35" x2="-35" y2="35"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.15s" repeatCount="indefinite" additive="sum"/>
    </g>

    <path class="line" d="M182 292l86-104 88 104H182l126-2 63-112 85 114"/>
    <path class="line" d="M371 180h55"/>
    <path class="line" d="M258 188l-24-44"/>
    <path class="line" d="M218 144h53"/>
    <circle cx="308" cy="290" r="13" fill="#ffd55a" stroke="#243447" stroke-width="4"/>

    <g transform="translate(308 290)">
      <g>
        <line class="line" x1="0" y1="0" x2="40" y2="0"/>
        <circle cx="50" cy="0" r="8" fill="#243447"/>
        <line class="line" x1="0" y1="0" x2="-40" y2="0"/>
        <circle cx="-50" cy="0" r="8" fill="#243447"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.15s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="1.15s" repeatCount="indefinite"/>
    <ellipse class="body" cx="306" cy="156" rx="58" ry="78" transform="rotate(-10 306 156)"/>
    <path class="wing" d="M276 136c-28 38-8 82 50 93 7-39-5-71-50-93z"/>
    <path class="body" d="M321 86c31-33 81-21 93 18 11 35-19 67-58 61-45-7-66-45-35-79z"/>
    <circle cx="384" cy="104" r="6" fill="#243447"/>
    <path class="beak" d="M410 116c38-9 91-4 148 15-57 23-111 24-153 7z"/>
    <path class="pouch" d="M410 137c35 12 80 12 129-2-31 36-81 47-119 25-12-7-15-15-10-23z"/>
    <path class="thin" d="M412 116c-3 9-3 16-1 23"/>
    <path class="body" d="M363 76c-5-24 12-41 38-38"/>
    <path class="thin" d="M379 66c11-9 23-13 37-11"/>
    <path class="leg" d="M292 225c-10 17-2 35 16 52"/>
    <path class="leg" d="M332 224c20 13 23 35 19 61"/>
    <g>
      <path class="leg" d="M308 277l42 13"/>
      <circle cx="352" cy="291" r="7" fill="#de8b2f"/>
      <animateTransform attributeName="transform" type="rotate" values="0 308 277;25 308 277;0 308 277;-25 308 277;0 308 277" dur="1.15s" repeatCount="indefinite"/>
    </g>
    <g>
      <path class="leg" d="M351 285l-42 5"/>
      <circle cx="308" cy="290" r="7" fill="#de8b2f"/>
      <animateTransform attributeName="transform" type="rotate" values="0 351 285;-25 351 285;0 351 285;25 351 285;0 351 285" dur="1.15s" repeatCount="indefinite"/>
    </g>
  </g>

  <g opacity=".55">
    <path class="thin" d="M60 114h72"/>
    <path class="thin" d="M82 94h38"/>
    <path class="thin" d="M500 78h74"/>
    <path class="thin" d="M526 58h36"/>
  </g>
</svg>