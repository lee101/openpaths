<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes flail {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-20deg); }
    }
    @keyframes pedalMove {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(15deg); }
    }
    
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    .bike-bob { animation: bob 0.6s ease-in-out infinite; }
    .pelican-body { animation: bob 0.6s ease-in-out infinite; }
    .wing { transform-box: fill-box; transform-origin: top right; animation: flail 0.6s ease-in-out infinite; }
    .leg { transform-box: fill-box; transform-origin: center; animation: pedalMove 1.2s ease-in-out infinite; }
    .leg-back { animation: pedalMove 1.2s ease-in-out -0.6s infinite; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffecd9"/>
  <circle cx="320" cy="70" r="30" fill="#ffb347" opacity="0.6"/>
  <ellipse cx="200" cy="360" rx="180" ry="15" fill="#d9c9b8" opacity="0.5"/>

  <!-- Ground Line -->
  <line x1="20" y1="350" x2="380" y2="350" stroke="#000" stroke-width="4" stroke-linecap="round" opacity="0.2"/>

  <!-- Animated Group -->
  <g class="bike-bob">
    
    <!-- Back Wheel -->
    <g transform="translate(130, 300)">
      <g class="wheel">
        <circle cx="0" cy="0" r="45" fill="none" stroke="#2c3e50" stroke-width="8"/>
        <circle cx="0" cy="0" r="38" fill="none" stroke="#95a5a6" stroke-width="3"/>
        <line x1="-45" y1="0" x2="45" y2="0" stroke="#95a5a6" stroke-width="3"/>
        <line x1="0" y1="-45" x2="0" y2="45" stroke="#95a5a6" stroke-width="3"/>
        <line x1="-32" y1="-32" x2="32" y2="32" stroke="#95a5a6" stroke-width="3"/>
        <line x1="-32" y1="32" x2="32" y2="-32" stroke="#95a5a6" stroke-width="3"/>
        <circle cx="0" cy="0" r="6" fill="#2c3e50"/>
      </g>
    </g>

    <!-- Front Wheel -->
    <g transform="translate(270, 300)">
      <g class="wheel">
        <circle cx="0" cy="0" r="45" fill="none" stroke="#2c3e50" stroke-width="8"/>
        <circle cx="0" cy="0" r="38" fill="none" stroke="#95a5a6" stroke-width="3"/>
        <line x1="-45" y1="0" x2="45" y2="0" stroke="#95a5a6" stroke-width="3"/>
        <line x1="0" y1="-45" x2="0" y2="45" stroke="#95a5a6" stroke-width="3"/>
        <line x1="-32" y1="-32" x2="32" y2="32" stroke="#95a5a6" stroke-width="3"/>
        <line x1="-32" y1="32" x2="32" y2="-32" stroke="#95a5a6" stroke-width="3"/>
        <circle cx="0" cy="0" r="6" fill="#2c3e50"/>
      </g>
    </g>

    <!-- Bicycle Frame -->
    <g fill="none" stroke="#e74c3c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main Triangle -->
      <path d="M 130 300 L 200 280 L 260 230 L 130 300"/>
      <!-- Seat Tube -->
      <path d="M 200 280 L 210 210"/>
      <!-- Front Fork -->
      <path d="M 260 230 L 270 300"/>
      <!-- Handlebar Stem -->
      <path d="M 260 230 L 265 200"/>
      <!-- Handlebars -->
      <path d="M 265 200 L 285 195"/>
      <!-- Seat -->
      <path d="M 195 210 L 225 210" stroke="#2c3e50" stroke-width="10"/>
      <!-- Chainring -->
      <circle cx="200" cy="280" r="16" stroke="#2c3e50" stroke-width="6"/>
      <!-- Chain -->
      <path d="M 130 300 L 200 296 M 130 300 L 200 264" stroke="#7f8c8d" stroke-width="4"/>
    </g>

    <!-- Pelican Feet / Pedals -->
    <!-- Back Foot (on chainring) -->
    <g class="leg leg-back">
      <!-- Leg -->
      <path d="M 180 180 Q 190 230 200 270" fill="none" stroke="#f39c12" stroke-width="8" stroke-linecap="round"/>
      <!-- Pedal -->
      <rect x="190" y="267" width="20" height="6" fill="#2c3e50" rx="2"/>
      <!-- Foot -->
      <ellipse cx="194" cy="273" rx="12" ry="6" fill="#e67e22" transform="rotate(-15 194 273)"/>
    </g>

    <!-- Pelican Body -->
    <g class="pelican-body">
      <!-- Body -->
      <path d="M 160 140 C 140 170, 140 200, 170 210 L 210 200 C 230 180, 230 150, 210 130 Z" fill="#ffffff" stroke="#bdc3c7" stroke-width="2"/>
      
      <!-- Wing -->
      <path class="wing" d="M 190 150 C 170 170, 170 190, 190 200 C 200 190, 200 170, 190 150" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
      
      <!-- Neck -->
      <path d="M 210 140 C 230 120, 240 100, 250 70" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
      <path d="M 210 140 C 230 120, 240 100, 250 70" fill="none" stroke="#bdc3c7" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
      
      <!-- Head -->
      <circle cx="255" cy="65" r="18" fill="#ffffff" stroke="#bdc3c7" stroke-width="2"/>
      
      <!-- Eye -->
      <circle cx="260" cy="60" r="3" fill="#2c3e50"/>
      <circle cx="261" cy="59" r="1" fill="#ffffff"/>
      
      <!-- Beak (Upper) -->
      <path d="M 268 60 L 300 65 L 268 72 Z" fill="#f39c12" stroke="#d35400" stroke-width="1"/>
      <!-- Beak (Lower/Pouch) -->
      <path d="M 268 70 Q 285 95 298 68 L 268 70 Z" fill="#f39c12" opacity="0.9" stroke="#d35400" stroke-width="1"/>
      
      <!-- Front Foot / Pedal (Animated to look like pedaling, roughly synced) -->
      <g class="leg">
        <!-- Leg -->
        <path d="M 190 190 Q 210 240 200 270" fill="none" stroke="#f39c12" stroke-width="8" stroke-linecap="round"/>
        <!-- Pedal -->
        <rect x="190" y="267" width="20" height="6" fill="#2c3e50" rx="2"/>
        <!-- Foot -->
        <ellipse cx="194" cy="273" rx="12" ry="6" fill="#e67e22" transform="rotate(-15 194 273)"/>
      </g>
      
      <!-- Arm / Wing to Handlebar -->
      <path d="M 200 150 Q 230 170 265 200" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <path d="M 200 150 Q 230 170 265 200" fill="none" stroke="#bdc3c7" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <!-- Hand -->
      <circle cx="265" cy="200" r="6" fill="#f39c12"/>
    </g>
    
  </g>
  
  <!-- Speed Lines -->
  <g stroke="#bdc3c7" stroke-width="4" stroke-linecap="round" opacity="0.">
    <animate attributeName="opacity" values="0;0.5;0" dur="1.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -20 0" dur="1.2s" repeatCount="indefinite"/>
    <line x1="40" y1="150" x2="80" y2="150"/>
    <line x1="30" y1="200" x2="90" y2="200"/>
    <line x1="50" y1="250" x2="85" y2="250"/>
  </g>

</svg>