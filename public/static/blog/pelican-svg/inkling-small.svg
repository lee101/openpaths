<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="60%" stop-color="#B3E5FC"/>
      <stop offset="100%" stop-color="#E1F5FE"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="50%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#FF6F5C"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="50%" stop-color="#9E9E9E"/>
      <stop offset="100%" stop-color="#BDBDBD"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="680" cy="100" r="45" fill="#FFF9C4" filter="url(#glow)"/>
  <circle cx="680" cy="100" r="32" fill="#FFFDE7"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="150" cy="130" rx="60" ry="22"/>
    <ellipse cx="200" cy="140" rx="50" ry="20"/>
    <ellipse cx="100" cy="145" rx="45" ry="18"/>
    <ellipse cx="520" cy="80" rx="70" ry="24"/>
    <ellipse cx="580" cy="90" rx="55" ry="22"/>
    <ellipse cx="460" cy="85" rx="45" ry="18"/>
  </g>

  <!-- Distant hills -->
  <path d="M0 480 Q150 430 300 470 T600 450 T800 470 L800 600 L0 600 Z" fill="#81C784" opacity="0.8"/>
  <path d="M0 520 Q200 480 400 510 T800 490 L800 600 L0 600 Z" fill="#66BB6A" opacity="0.6"/>

  <!-- Ground -->
  <rect x="0" y="500" width="800" height="100" fill="#7CB342"/>
  <rect x="0" y="495" width="800" height="15" fill="#558B2F"/>

  <!-- Grass tufts -->
  <g stroke="#558B2F" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M80 500 Q85 485 90 500"/>
    <path d="M120 502 Q125 488 130 502"/>
    <path d="M200 498 Q205 482 210 498"/>
    <path d="M260 501 Q265 486 270 501"/>
    <path d="M350 499 Q355 484 360 499"/>
    <path d="M420 500 Q425 485 430 500"/>
    <path d="M500 498 Q505 483 510 498"/>
    <path d="M580 501 Q585 487 590 501"/>
    <path d="M650 499 Q655 485 660 499"/>
    <path d="M720 502 Q725 488 730 502"/>
  </g>

  <!-- Bicycle -->
  <g filter="url(#softShadow)">
    <!-- Rear wheel -->
    <circle cx="260" cy="430" r="85" fill="none" stroke="#333" stroke-width="6"/>
    <circle cx="260" cy="430" r="78" fill="none" stroke="#777" stroke-width="1.5"/>
    <!-- Spokes rear -->
    <g stroke="#777" stroke-width="1">
      <line x1="260" y1="430" x2="260" y2="350"/>
      <line x1="260" y1="430" x2="260" y2="510"/>
      <line x1="260" y1="430" x2="180" y2="372"/>
      <line x1="260" y1="430" x2="340" y2="372"/>
      <line x1="260" y1="430" x2="185" y2="488"/>
      <line x1="260" y1="430" x2="335" y2="488"/>
      <line x1="260" y1="430" x2="220" y2="350"/>
      <line x1="260" y1="430" x2="300" y2="350"/>
      <line x1="260" y1="430" x2="220" y2="510"/>
      <line x1="260" y1="430" x2="300" y2="510"/>
    </g>
    <circle cx="260" cy="430" r="6" fill="#333"/>

    <!-- Front wheel -->
    <circle cx="540" cy="430" r="85" fill="none" stroke="#333" stroke-width="6"/>
    <circle cx="540" cy="430" r="78" fill="none" stroke="#777" stroke-width="1.5"/>
    <!-- Spokes front -->
    <g stroke="#777" stroke-width="1">
      <line x1="540" y1="430" x2="540" y2="350"/>
      <line x1="540" y1="430" x2="540" y2="510"/>
      <line x1="540" y1="430" x2="460" y2="372"/>
      <line x1="540" y1="430" x2="620" y2="372"/>
      <line x1="540" y1="430" x2="465" y2="488"/>
      <line x1="540" y1="430" x2="615" y2="488"/>
      <line x1="540" y1="430" x2="500" y2="350"/>
      <line x1="540" y1="430" x2="580" y2="350"/>
      <line x1="540" y1="430" x2="500" y2="510"/>
      <line x1="540" y1="430" x2="580" y2="510"/>
    </g>
    <circle cx="540" cy="430" r="6" fill="#333"/>

    <!-- Frame -->
    <g stroke="#0D47A1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Seat tube -->
      <line x1="300" y1="340" x2="340" y2="440"/>
      <!-- Top tube -->
      <line x1="300" y1="340" x2="480" y2="340"/>
      <!-- Down tube -->
      <line x1="300" y1="340" x2="380" y2="440"/>
      <!-- Chain stay -->
      <line x1="260" y1="430" x2="380" y2="430"/>
      <!-- Seat stay -->
      <line x1="340" y1="340" x2="260" y2="430"/>
    </g>
    <!-- Frame accents -->
    <g stroke="#BBDEFB" stroke-width="2" fill="none">
      <line x1="305" y1="343" x2="305" y2="338"/>
      <line x1="475" y1="343" x2="485" y2="343"/>
    </g>

    <!-- Seat -->
    <rect x="280" y="320" width="60" height="25" rx="8" ry="8" fill="#5D4037" stroke="#3E2723" stroke-width="2"/>
    <rect x="285" y="325" width="50" height="12" rx="3" fill="#8D6E63"/>

    <!-- Handlebars / Stem -->
    <line x1="480" y1="340" x2="500" y2="290" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <line x1="500" y1="290" x2="550" y2="285" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <line x1="490" y1="295" x2="460" y2="285" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <!-- Grips -->
    <rect x="540" y="278" width="22" height="10" rx="3" fill="#111" transform="rotate(-15 551 283)"/>
    <rect x="450" y="278" width="22" height="10" rx="3" fill="#111" transform="rotate(10 461 283)"/>

    <!-- Front fork -->
    <line x1="540" y1="430" x2="540" y2="310" stroke="#777" stroke-width="5" stroke-linecap="round"/>
    <line x1="535" y1="320" x2="545" y2="320" stroke="#555" stroke-width="3"/>

    <!-- Pedals -->
    <g>
      <circle cx="370" cy="430" r="12" fill="url(#metal)" stroke="#777" stroke-width="2"/>
      <rect x="365" y="422" width="10" height="16" rx="2" fill="#333" transform="rotate(25 370 430)"/>
      <circle cx="370" cy="430" r="3" fill="#555"/>
    </g>

    <!-- Chain -->
    <path d="M300 430 Q320 460 380 430" fill="none" stroke="#555" stroke-width="2"/>
    <path d="M310 432 Q330 442 370 432" fill="none" stroke="#777" stroke-width="1"/>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Body -->
    <ellipse cx="410" cy="340" rx="55" ry="42" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="2" transform="rotate(-8 410 340)"/>
    <!-- Wing (large folded) -->
    <path d="M360 350 Q320 360 310 390 Q340 400 370 370 Z" fill="#E8E8E8" stroke="#BDBDBD" stroke-width="1.5"/>
    <path d="M350 345 Q330 350 325 375 Q345 385 365 360 Z" fill="#F5F5F5" stroke="#C0C0C0" stroke-width="1"/>
    <!-- Chest feather details -->
    <path d="M390 320 Q405 330 420 325 T440 330" fill="none" stroke="#D5D5D5" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M410 310 Q420 280 440 270" fill="none" stroke="#F5F5F5" stroke-width="22" stroke-linecap="round"/>
    <path d="M410 310 Q420 280 440 270" fill="none" stroke="#EAEAEA" stroke-width="10" stroke-linecap="round"/>

    <!-- Head -->
    <ellipse cx="450" cy="265" rx="22" ry="18" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2" transform="rotate(-10 450 265)"/>
    <!-- Head feather tufts -->
    <path d="M440 250 Q445 240 450 250 T460 245" fill="none" stroke="#F5F5F5" stroke-width="3" stroke-linecap="round"/>
    <path d="M455 248 Q465 240 470 250" fill="none" stroke="#F5F5F5" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eye -->
    <ellipse cx="460" cy="262" rx="5" ry="7" fill="#212121" transform="rotate(-10 460 262)"/>
    <circle cx="462" cy="260" r="2" fill="#FFFFFF"/>
    <circle cx="461" cy="263" r="0.8" fill="#FFFFFF"/>

    <!-- Beak -->
    <g>
      <path d="M465 270 Q500 280 560 260 Q530 300 490 290 Z" fill="url(#beakGrad)"/>
      <path d="M490 290 Q540 310 560 260" fill="none" stroke="#FF7043" stroke-width="2"/>
      <!-- Pouch -->
      <path d="M490 285 Q520 295 540 275 Q520 290 490 290 Z" fill="#FFCC80" opacity="0.7"/>
      <path d="M495 286 Q515 292 535 278" fill="none" stroke="#F57C00" stroke-width="1"/>
      <!-- Beak tip -->
      <path d="M555 258 L575 250 L565 268 Z" fill="#FFF176"/>
      <path d="M555 258 L575 250 L565 268 Z" fill="none" stroke="#F9A825" stroke-width="1"/>
    </g>

    <!-- Legs -->
    <g fill="#FF8A65" stroke="#E64A19" stroke-width="1.5" stroke-linecap="round">
      <!-- Thigh -->
      <rect x="395" y="370" width="10" height="35" rx="3" transform="rotate(-15 400 387)"/>
      <rect x="415" y="375" width="10" height="35" rx="3" transform="rotate(10 420 392)"/>
      <!-- Feet -->
      <ellipse cx="395" cy="420" rx="10" ry="6" fill="#FF8A65" transform="rotate(-20 395 420)"/>
      <ellipse cx="430" cy="425" rx="11" ry="7" fill="#FF8A65" transform="rotate(15 430 425)"/>
      <!-- Webbed toes -->
      <path d="M385 425 Q390 435 395 425" fill="none" stroke="#E64A19" stroke-width="2"/>
      <path d="M390 430 Q395 440 400 430" fill="none" stroke="#E64A19" stroke-width="2"/>
      <path d="M425 430 Q430 440 435 430" fill="none" stroke="#E64A19" stroke-width="2"/>
      <path d="M435 435 Q440 445 445 435" fill="none" stroke="#E64A19" stroke-width="2"/>
    </g>
    <!-- Feet positioned on seat/pedal -->
    <ellipse cx="410" cy="335" rx="8" ry="5" fill="#FF8A65" stroke="#E64A19" stroke-width="1.5"/>
    <ellipse cx="435" cy="340" rx="9" ry="6" fill="#FF8A65" stroke="#E64A19" stroke-width="1.5"/>

    <!-- Tail feathers -->
    <path d="M360 350 Q330 365 340 390 Q360 385 370 365 Z" fill="#EEEEEE" stroke="#D3D3D3" stroke-width="1"/>
  </g>

</svg>