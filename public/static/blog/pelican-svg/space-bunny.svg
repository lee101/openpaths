<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">An animated scene of a cheerful pelican pedaling a blue bicycle beside the sea.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35b7d3"/>
      <stop offset="1" stop-color="#1683ad"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf4b"/>
      <stop offset="1" stop-color="#ed8b25"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8b0"/>
      <stop offset="1" stop-color="#ffe26b"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#164765" flood-opacity=".28"/>
    </filter>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="48" ry="20" fill="#fff"/>
      <ellipse cx="-23" cy="-8" rx="27" ry="25" fill="#fff"/>
      <ellipse cx="12" cy="-15" rx="33" ry="31" fill="#fff"/>
      <ellipse cx="37" cy="2" rx="30" ry="21" fill="#fff"/>
    </g>
    <g id="wheel">
      <circle r="73" fill="#254a58" opacity=".18" transform="translate(0 4)"/>
      <circle r="69" fill="#f6fbfc" stroke="#263f4a" stroke-width="9"/>
      <circle r="56" fill="none" stroke="#74c8dd" stroke-width="3" stroke-dasharray="4 8"/>
      <g stroke="#58717b" stroke-width="3">
        <line x1="0" y1="-59" x2="0" y2="59"/>
        <line x1="-59" y1="0" x2="59" y2="0"/>
        <line x1="-42" y1="-42" x2="42" y2="42"/>
        <line x1="42" y1="-42" x2="-42" y2="42"/>
        <line x1="-57" y1="-19" x2="57" y2="19"/>
        <line x1="57" y1="-19" x2="-57" y2="19"/>
      </g>
      <circle r="10" fill="#263f4a"/>
      <g fill="#ffcf43">
        <circle cx="0" cy="-54" r="5"/>
        <circle cx="54" y1="0" r="5"/>
        <circle cx="0" y1="54" r="5"/>
        <circle cx="-54" y1="0" r="5"/>
      </g>
    </g>
    <g id="puff">
      <circle cx="0" cy="0" r="11" fill="#e7f4f8" opacity=".85"/>
      <circle cx="8" cy="0" r="8" fill="#e7f4f8" opacity=".65"/>
    </g>
  </defs>

  <rect width="900" height="600" fill="url(#sky)"/>
  <circle cx="744" cy="92" r="54" fill="url(#sun)">
    <animate attributeName="r" values="54;58;54" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".82">
    <use href="#cloud" transform="translate(140 105) scale(.85)">
      <animateTransform attributeName="transform" type="translate" values="110 105;820 105" dur="24s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" transform="translate(530 62) scale(.55)">
      <animateTransform attributeName="transform" type="translate" values="780 62;80 62" dur="31s" repeatCount="indefinite"/>
    </use>
  </g>

  <path d="M0 300 Q105 278 210 300 T420 300 T630 300 T900 300 V600 H0Z" fill="url(#sea)"/>
  <g fill="none" stroke="#c3f2f7" stroke-width="5" stroke-linecap="round" opacity=".7">
    <path d="M20 345q35-15 70 0t70 0t70 0t70 0t70 0t70 0t70 0t70 0t70 0t70 0">
      <animate attributeName="d" dur="4s" repeatCount="indefinite" values="M20 345q35-15 70 0t70 0t70 0t70 0t70 0t70 0t70 0t70 0t70 0t70 0;M20 345q35 15 70 0t70 0t70 0t70 0t70 0t70 0t70 0t70 0t70 0t70 0"/>
    </path>
    <path d="M-30 395q35-12 70 0t70 0t70 0t70 0t70 0t70 0t70 0t70 0t70 0t70 0" opacity=".55"/>
  </g>

  <path d="M0 470 Q165 438 312 473 T600 469 T900 459 V600 H0Z" fill="#e4d18f"/>
  <path d="M0 508 Q170 477 340 510 T670 504 T900 495 V600 H0Z" fill="#6fc06a"/>
  <path d="M0 552 Q210 521 430 550 T900 541 V600 H0Z" fill="#4ba658"/>

  <g fill="#397f49">
    <g transform="translate(76 433)">
      <path d="M0 61C4 25 8 7 15-26h12C20 6 13 35 10 61Z"/>
      <path d="M15 3C-8 0-18-9-24-24 4-25 20-15 20-1Z"/>
      <path d="M16 0C38-2 52-15 56-33 34-31 17-19 15 0Z"/>
      <path d="M18 27C-1 23-12 12-17-2 7-3 19 7 21 19Z"/>
      <path d="M19 25C37 20 48 9 52-7 34-4 22 5 18 17Z"/>
    </g>
    <g transform="translate(824 438) scale(.85)">
      <path d="M0 61C4 25 8 7 15-26h12C20 6 13 35 10 61Z"/>
      <path d="M15 3C-8 0-18-9-24-24 4-25 20-15 20-1Z"/>
      <path d="M16 0C38-2 52-15 56-33 34-31 17-19 15 0Z"/>
      <path d="M18 27C-1 23-12 12-17-2 7-3 19 7 21 19Z"/>
      <path d="M19 25C37 20 48 9 52-7 34-4 22 5 18 17Z"/>
    </g>
  </g>

  <g opacity=".9">
    <use href="#puff" transform="translate(117 496)">
      <animate attributeName="opacity" values="0;.9;0" dur="1.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="117 496;95 486" dur="1.1s" repeatCount="indefinite"/>
    </use>
    <use href="#puff" transform="translate(117 496)">
      <animate attributeName="opacity" values="0;.9;0" dur="1.1s" begin=".55s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="117 496;139 486" dur="1.1s" begin=".55s" repeatCount="indefinite"/>
    </use>
  </g>

  <g filter="url(#shadow)">
    <g id="bicycle" transform="translate(0 -3)">
      <g>
        <use href="#wheel" transform="translate(252 448)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 252 448" to="360 252 448" dur="1.1s" repeatCount="indefinite"/>
      </g>
      <g>
        <use href="#wheel" transform="translate(665 448)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 665 448" to="360 665 448" dur="1.1s" repeatCount="indefinite"/>
      </g>

      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M252 448L358 448L454 331L503 448L358 448L424 264L503 448L665 448" stroke="#174e70" stroke-width="15"/>
        <path d="M252 448L358 448L424 264L503 448L665 448" stroke="#278bb4" stroke-width="8"/>
        <path d="M424 264L493 259L503 448" stroke="#174e70" stroke-width="13"/>
        <path d="M424 264L493 259L503 448" stroke="#54b8d2" stroke-width="7"/>
        <path d="M493 259Q511 252 519 264" stroke="#263f4a" stroke-width="8"/>
        <path d="M506 261L531 257" stroke="#263f4a" stroke-width="11"/>
        <path d="M413 263Q424 251 438 260" stroke="#263f4a" stroke-width="8"/>
      </g>
      <circle cx="358" cy="448" r="22" fill="#f1b82c" stroke="#263f4a" stroke-width="7">
        <animateTransform attributeName="transform" type="rotate" from="0 358 448" to="360 358 448" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#263f4a" stroke-width="6" stroke-linecap="round">
        <path d="M358 448L334 474L358 485L382 474Z" fill="#f1b82c"/>
        <path d="M358 448L358 423"/>
      </g>
    </g>

    <g id="rider" transform="translate(0 0)">
      <path d="M398 284Q430 266 463 286L500 344Q464 365 420 348L383 312Z" fill="#f8fbf7" stroke="#49616b" stroke-width="5"/>
      <path d="M470 303L505 338L535 317" fill="none" stroke="#f8fbf7" stroke-width="22" stroke-linecap="round"/>
      <path d="M525 321L553 309" fill="none" stroke="#f4a52e" stroke-width="11" stroke-linecap="round"/>

      <g>
        <path d="M380 344L356 417L389 423L426 351Z" fill="#f6faf6" stroke="#49616b" stroke-width="5"/>
        <path d="M358 412L386 420" stroke="#f4a52e" stroke-width="10" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="5 393 347;-5 393 347;5 393 347" dur="1.1s" repeatCount="indefinite"/>
      </g>
      <g>
        <path d="M418 348L438 409L470 404L440 335Z" fill="#e7efeb" stroke="#49616b" stroke-width="5"/>
        <path d="M438 404L468 405" stroke="#f4a52e" stroke-width="10" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="-5 427 344;5 427 344;-5 427 344" dur="1.1s" repeatCount="indefinite"/>
      </g>

      <ellipse cx="385" cy="199" rx="59" ry="54" fill="#f9fbf5" stroke="#49616b" stroke-width="5"/>
      <path d="M365 161Q392 136 420 153" fill="none" stroke="#d6e2df" stroke-width="7" stroke-linecap="round"/>
      <path d="M342 198Q405 199 453 222Q420 270 364 242Z" fill="url(#beak)" stroke="#6c5837" stroke-width="5" stroke-linejoin="round"/>
      <path d="M362 222Q405 240 442 229Q424 258 382 252Z" fill="#ee9d2e"/>
      <path d="M399 235Q408 246 399 258" fill="none" stroke="#c87122" stroke-width="4"/>
      <circle cx="382" cy="184" r="10" fill="#fff"/>
      <circle cx="385" cy="185" r="5" fill="#1e343c">
        <animate attributeName="cx" values="385;382;385" dur="4s" repeatCount="indefinite"/>
      </circle>
      <path d="M356 168Q369 156 385 162" fill="none" stroke="#49616b" stroke-width="5" stroke-linecap="round"/>
      <path d="M350 154Q337 131 357 112" fill="none" stroke="#49616b" stroke-width="6" stroke-linecap="round"/>
      <path d="M355 119Q339 99 354 83Q368 72 376 91Q381 105 368 114Z" fill="#49616b"/>
      <path d="M355 153Q374 145 386 158" fill="none" stroke="#49616b" stroke-width="6" stroke-linecap="round"/>

      <path d="M418 264Q431 248 445 263" fill="none" stroke="#49616b" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(0 0)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur=".55s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".65">
    <path d="M112 389h70M92 410h45M126 410h35"/>
    <animate attributeName="opacity" values="0;.65;0" dur="1.1s" repeatCount="indefinite"/>
  </g>
</svg>
