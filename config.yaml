server:
  port: 8090
  read_timeout_seconds: 30
  write_timeout_seconds: 300
  max_request_body_mb: 25
  static_dir: "./dist"

database:
  url: "postgres://openpath:openpath@localhost:5432/openpath?sslmode=disable"
  max_conns: 20
  min_conns: 2

jwt:
  secret: "${JWT_SECRET}"
  expiration_hours: 72

stripe:
  secret_key: "${STRIPE_SECRET_KEY}"
  publishable_key: "${STRIPE_PUBLISHABLE_KEY}"
  webhook_secret: "${STRIPE_WEBHOOK_SECRET}"
  credits_price_id: "price_1T6egFHXPxordcGkslP1HYDP"

crypto:
  enabled: true
  solana_wallet_pubkey: "${SOLANA_WALLET_PUBKEY}"
  hd_wallet_seed: "${HD_WALLET_SEED}"
  helius_api_key: "${HELIUS_API_KEY}"
  bags_api_key: "${BAGS_API_KEY}"
  min_topup_usd: 5

providers:
  - name: netwrck
    base_url: "https://netwrck.com"
    api_key: "${NETWRCK_API_KEY}"
    enabled: true

  - name: openai
    base_url: "https://api.openai.com"
    api_key: "${OPENAI_API_KEY}"
    enabled: true

  - name: anthropic
    base_url: "https://api.anthropic.com"
    api_key: "${ANTHROPIC_API_KEY}"
    enabled: true

  - name: google
    base_url: "https://generativelanguage.googleapis.com"
    api_key: "${GEMINI_API_KEY}"
    enabled: true

  - name: mistral
    base_url: "https://api.mistral.ai"
    api_key: "${MISTRAL_API_KEY}"
    enabled: true

  - name: groq
    base_url: "https://api.groq.com/openai"
    api_key: "${GROQ_API_KEY}"
    enabled: true

  - name: xai
    base_url: "https://api.x.ai"
    api_key: "${XAI_API_KEY}"
    enabled: true

  - name: deepseek
    base_url: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    enabled: true

  - name: openrouter
    base_url: "https://openrouter.ai/api"
    api_key: "${OPENROUTER_API_KEY}"
    enabled: true

  - name: together
    base_url: "https://api.together.xyz"
    api_key: "${TOGETHER_API_KEY}"
    enabled: true

  - name: minimax
    base_url: "https://api.minimax.io"
    api_key: "${MINIMAX_API_KEY}"
    enabled: true

  - name: textgenerator
    base_url: "https://api.text-generator.io"
    api_key: "${TEXTGENERATOR_API_KEY}"
    enabled: true

  - name: zai
    base_url: "https://api.z.ai"
    api_key: "${Z_API_KEY}"
    enabled: true

  - name: nous
    base_url: "https://inference-api.nousresearch.com"
    api_key: "${NOUS_API_KEY}"
    enabled: true

  - name: fal
    base_url: ""
    api_key: "${FAL_API_KEY}"
    enabled: true

models:
  # --- Auto (Gemini 3.1 primary, cross-provider fallbacks) ---
  - id: "auto"
    provider: google
    provider_model_id: "gemini-3.1-pro-preview"
    input_price_per_1m: 2.00
    output_price_per_1m: 12.00
    aliases: ["auto-chat", "auto-text"]
    context_window: 1000000
    max_output_tokens: 64000
    supports_streaming: true
    supports_tools: true
    supports_vision: true
    fallback_models:
      - "gpt-5.4"
      - "gpt-5-chat-latest"
      - "deepseek-chat"
      - "claude-sonnet-4-6"
      - "grok-4-0709"
