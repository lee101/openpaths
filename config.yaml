server:
  port: 8092
  read_timeout_seconds: 30
  write_timeout_seconds: 600
  max_request_body_mb: 25
  static_dir: "./dist"

database:
  url: "postgres://openpath:openpath@localhost:5432/openpath?sslmode=disable"
  max_conns: 20
  min_conns: 2

jwt:
  secret: "${JWT_SECRET}"
  expiration_hours: 72

stripe:
  secret_key: "${STRIPE_SECRET_KEY}"
  publishable_key: "${STRIPE_PUBLISHABLE_KEY}"
  webhook_secret: "${STRIPE_WEBHOOK_SECRET}"
  credits_price_id: "price_1T6egFHXPxordcGkslP1HYDP"

crypto:
  enabled: true
  solana_wallet_pubkey: "${SOLANA_WALLET_PUBKEY}"
  hd_wallet_seed: "${HD_WALLET_SEED}"
  helius_api_key: "${HELIUS_API_KEY}"
  bags_api_key: "${BAGS_API_KEY}"
  min_topup_usd: 5

providers:
  - name: netwrck
    base_url: "https://netwrck.com"
    api_key: "${NETWRCK_API_KEY}"
    enabled: true

  - name: cutedsl
    base_url: "https://cutedsl.cc"
    api_key: "${CUTEDSL_API_KEY}"
    enabled: true

  - name: openai
    base_url: "https://api.openai.com"
    api_key: "${OPENAI_API_KEY}"
    enabled: true

  - name: anthropic
    base_url: "https://api.anthropic.com"
    api_key: "${ANTHROPIC_API_KEY}"
    enabled: true

  - name: google
    base_url: "https://generativelanguage.googleapis.com"
    api_key: "${GEMINI_API_KEY}"
    enabled: true

  - name: mistral
    base_url: "https://api.mistral.ai"
    api_key: "${MISTRAL_API_KEY}"
    enabled: true

  - name: groq
    base_url: "https://api.groq.com/openai"
    api_key: "${GROQ_API_KEY}"
