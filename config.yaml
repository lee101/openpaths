server:
  port: 8092
  read_timeout_seconds: 30
  write_timeout_seconds: 600
  max_request_body_mb: 25
  static_dir: "./dist"

database:
  url: "postgres://openpath:openpath@localhost:5432/openpath?sslmode=disable"
  max_conns: 20
  min_conns: 2

jwt:
  secret: "${JWT_SECRET}"
  expiration_hours: 72

stripe:
  secret_key: "${STRIPE_SECRET_KEY}"
  publishable_key: "${STRIPE_PUBLISHABLE_KEY}"
  webhook_secret: "${STRIPE_WEBHOOK_SECRET}"
  credits_price_id: "price_1T6egFHXPxordcGkslP1HYDP"

crypto:
  enabled: true
  solana_wallet_pubkey: "${SOLANA_WALLET_PUBKEY}"
  hd_wallet_seed: "${HD_WALLET_SEED}"
  helius_api_key: "${HELIUS_API_KEY}"
  bags_api_key: "${BAGS_API_KEY}"
  min_topup_usd: 5

providers:
  - name: bfl
    base_url: "https://api.bfl.ai"
    api_key: "${BFL_API_KEY}"
    enabled: true

  - name: netwrck
    base_url: "https://netwrck.com"
    api_key: "${NETWRCK_API_KEY}"
    enabled: true

  # Cloudflare Workers AI structured models (Clairic extraction, Clef
  # decisions). Auth: CLOUDFLARE_API_KEY (+ CLOUDFLARE_EMAIL for the global key).
  - name: cloudflare
    base_url: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run"
    api_key: "${CLOUDFLARE_API_KEY}"
    enabled: true

  - name: manifoldgen
    base_url: "https://manifoldgen.com"
    api_key: "${MANIFOLDGEN_API_KEY}"
    enabled: true

  - name: cutedsl
    base_url: "https://cutedsl.cc"
    api_key: "${CUTEDSL_API_KEY}"
    enabled: true

  - name: openai
    base_url: "https://api.openai.com"
    api_key: "${OPENAI_API_KEY}"
    enabled: true

  - name: meta
    base_url: "https://api.meta.ai/v1"
    api_key: "${MODEL_API_KEY}"
    enabled: true

  - name: anthropic
    base_url: "https://api.anthropic.com"
    api_key: "${ANTHROPIC_API_KEY}"
    enabled: true

  - name: google
    base_url: "https://generativelanguage.googleapis.com"
    api_key: "${GEMINI_API_KEY}"
    enabled: true

  - name: mistral
    base_url: "https://api.mistral.ai"
    api_key: "${MISTRAL_API_KEY}"
    enabled: true

  - name: groq
    base_url: "https://api.groq.com/openai"
    api_key: "${GROQ_API_KEY}"
    enabled: true

  - name: xai
    base_url: "https://api.x.ai"
    api_key: "${XAI_API_KEY}"
    enabled: true

  - name: deepseek
    base_url: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    enabled: true

  - name: openrouter
    base_url: "https://openrouter.ai/api"
    api_key: "${OPENROUTER_API_KEY}"
    enabled: true

  - name: together
    base_url: "https://api.together.xyz"
    api_key: "${TOGETHER_API_KEY}"
    enabled: true
  - name: qwen
    base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode"
    api_key: "${DASHSCOPE_API_KEY}"
    enabled: true

  # Alibaba Model Studio native async API (Wan video), Singapore workspace.
  - name: alibaba
    base_url: "https://ws-rvo01jxeg9yitdn7.ap-southeast-1.maas.aliyuncs.com"
    api_key: "${DASHSCOPE_API_KEY}"
    enabled: true

  - name: thinkingmachines
    base_url: "https://tinker.thinkingmachines.dev/services/tinker-prod/oai/api"
    api_key: "${TINKER_API_KEY}"
    enabled: true

  - name: minimax
    base_url: "https://api.minimax.io"
    api_key: "${MINIMAX_API_KEY}"
    enabled: true

  - name: textgenerator
    base_url: "https://api.text-generator.io"
    api_key: "${TEXTGENERATOR_API_KEY}"
    enabled: true

  - name: zai
    base_url: "https://api.z.ai"
    api_key: "${Z_API_KEY}"
    enabled: true

  - name: nous
    base_url: "https://inference-api.nousresearch.com"
    api_key: "${NOUS_API_KEY}"
    enabled: true

  - name: fireworks
    base_url: "https://api.fireworks.ai/inference"
    api_key: "${FIREWORKS_API_KEY}"
    enabled: true

  - name: nvidia
    base_url: "https://integrate.api.nvidia.com"
    api_key: "${NVIDIA_API_KEY}"
    enabled: true

  - name: fal
    base_url: ""
    api_key: "${FAL_API_KEY}"
    enabled: true

  - name: ebank
    base_url: "https://ebank.nz"
    api_key: "${EBANK_API_KEY}"
    enabled: true

  - name: exa
    base_url: "https://api.exa.ai"
    api_key: "${EXA_API_KEY}"
    enabled: true

  - name: cursor
    base_url: "https://api.cursor.com"
    api_key: "${CURSOR_API_KEY}"
    enabled: true

  - name: papers
    base_url: "https://papers.app.nz"
    api_key: "${APP_API_KEY}"
    enabled: true

  - name: appnz
    base_url: "${APPNZ_BASE_URL}"
    api_key: "${APPNZ_API_KEY}"
    enabled: true

  - name: appnz-qwen
    base_url: "https://app.nz/api/cogs/8a021d0d-55dd-4f66-8398-c67ca20c47ff"
    api_key: "${APPNZ_QWEN_API_KEY}"
    enabled: true
  - name: cerebras
    base_url: "https://api.cerebras.ai"
    api_key: "${CEREBRAS_API_KEY}"
    enabled: true

  # Wally Cloud (RunAnywhere): OpenAI-compatible hosted inference at
  # https://inference.runanywhere.ai/v1. The base URL omits /v1 because the
  # client appends it for chat completions and the /v1/models health probe.
  - name: runanywhere
    base_url: "https://inference.runanywhere.ai"
    api_key: "${RUNANYWHERE_API_KEY}"
    enabled: true

models:
  - id: "flux-3-image"
    provider: bfl
    provider_model_id: "flux-3-image"
    price_per_image: 0.048
    price_per_image_by_resolution:
      768sq: 0.041
      1k: 0.048
      2k: 0.100
      4k: 0.607
    aliases: ["bfl/flux-3-image", "flux3-image", "flux-3"]
    supports_streaming: false
    supports_tools: false
    supports_vision: true


  # Live speech: provider list prices + 5%, including text/reasoning and audio.
  - id: "gemini-3.8-live-extended-thinking"
    provider: google
    provider_model_id: "gemini-3.8-live-extended-thinking"
    input_price_per_1m: 0.7875
    output_price_per_1m: 4.725
    audio_input_price_per_1m: 3.15
    audio_output_price_per_1m: 12.60
    image_input_price_per_1m: 1.05
    aliases: ["gemini-live", "google-live"]
    context_window: 131072
    max_output_tokens: 65536
    supports_streaming: true
    supports_tools: true
    supports_vision: true

  # --- Meta Model API ---
  - id: "muse-spark-1.3"
    provider: meta
    provider_model_id: "muse-spark-1.3"
    input_price_per_1m: 1.25
    input_cache_hit_price_per_1m: 0.15
    output_price_per_1m: 4.25
    aliases: ["muse-spark", "meta-muse-spark", "meta-chat"]
    context_window: 1048576
    max_output_tokens: 131072
    supports_streaming: true
    supports_tools: true
    supports_vision: true

  - id: "muse-spark-1.3-contributor"
    provider: meta
    provider_model_id: "muse-spark-1.3-contributor"
    input_price_per_1m: 0.10
    input_cache_hit_price_per_1m: 0.002
    output_price_per_1m: 0.20
    aliases: ["muse-spark-contributor", "meta-muse-spark-contributor", "meta-contributor"]
    context_window: 1048576
    max_output_tokens: 131072
    supports_streaming: true
    supports_tools: true
    supports_vision: true

  - id: "muse-image-1.0"
    provider: meta
    provider_model_id: "muse-image-1.0"
    price_per_image: 0.01
    aliases: ["muse-image", "meta-image"]
    supports_streaming: false
    supports_tools: false
    supports_vision: false
    supported_sizes:
      - "1024x1024"
  # app.nz hosted, scale-to-zero Qwen3.8-27B uncensored GGUF. The public
  # output rate is the optimization target; measured deployment throughput is
  # checked before production promotion.
  - id: "openpaths/qwen3.8-27b-uncensored"
    provider: appnz-qwen
    provider_model_id: "qwen3.8-27b-uncensored"
    input_price_per_1m: 0.50
    output_price_per_1m: 4.50
    aliases: ["qwen3.8-27b-uncensored", "qwen-27b-uncensored", "appnz-qwen"]
    context_window: 32768
    max_output_tokens: 32768
    supports_streaming: true
    supports_tools: true
    supports_vision: false

  # Cerebras-hosted Qwen 3.8 27B dense multimodal model. Wafer-scale inference
  # at ~1500 tok/s; paid tier 128K context, 40K max output. Pricing per
  # https://www.cerebras.ai/pricing and https://inference-docs.cerebras.ai/models/qwen-3.8-27b.
  - id: "cerebras/qwen-3.8-27b"
    provider: cerebras
    provider_model_id: "qwen-3.8-27b"
    input_price_per_1m: 0.99
    output_price_per_1m: 1.49
    aliases: ["qwen-3.8-27b", "qwen3.8-27b", "cerebras-qwen", "cerebras/qwen"]
    context_window: 131072
    max_output_tokens: 40960
    supports_streaming: true
    supports_tools: true
    supports_vision: true

  # --- RunAnywhere (Wally Cloud) ---
  # The console quotes "cost to send/answer ~750,000 words", which is the
  # 1M-token billing unit Wally charges on (1M tokens ~= 750k words), so each
  # listed figure is already the per-1M-token rate. Resold at list price, like
  # the other gateway lanes. Model ids, limits and capability flags verified
  # against GET /v1/models plus live chat, tool, and image probes 2026-09-22.
  - id: "runanywhere/glm-5.3-flash"
    provider: runanywhere
    provider_model_id: "glm-5.3-flash"
    input_price_per_1m: 0.10
    output_price_per_1m: 0.35
    aliases: ["runa/glm-5.3-flash", "runanywhere-glm-5.3-flash", "runa-glm-5.3-flash"]
    context_window: 1048567
    max_output_tokens: 131072
    default_reasoning_effort: "max"
    supports_streaming: true
    supports_tools: true
    supports_vision: true

  - id: "runanywhere/qwen3.8-27b"
    provider: runanywhere
    provider_model_id: "qwen3.8-27b"
    input_price_per_1m: 0.20
    output_price_per_1m: 2.50
    aliases: ["runa/qwen3.8-27b", "runanywhere-qwen3.8-27b", "runa-qwen3.8-27b"]
    context_window: 262137
    max_output_tokens: 40960
    supports_streaming: true
    supports_tools: true
    supports_vision: true

  # --- OpenPaths Auto (hero + variants; embedding-routed) ---
  - id: "openpaths/auto"
    provider: google
    provider_model_id: "gemini-3.8-flash"
    input_price_per_1m: 0.75
    output_price_per_1m: 3.75
    aliases: ["auto", "auto-chat", "auto-text", "openpaths-auto"]
    context_window: 1000000
    max_output_tokens: 64000
    supports_streaming: true
    supports_tools: true
    supports_vision: true
    fallback_models:
      - "gpt-5.6-terra"
      - "glm-5.3"
      - "gpt-5.6-sol"
      - "deepseek-v4-pro"
      - "gpt-5-chat-latest"
      - "deepseek-v4-flash"
      - "deepseek-chat"
      - "claude-sonnet-5"
      - "grok-4.7"
      - "or/gpt-5.6-terra"

  # Cheap default for ordinary chat; hard coding/math/science prompts can
  # escalate through the fallback chain without making every chat expensive.
