models:

  # app.nz hosted, scale-to-zero Qwen3.8-27B uncensored GGUF. The public
  # output rate is the optimization target; measured deployment throughput is
  # checked before production promotion.
  - id: "openpaths/qwen3.8-27b-uncensored"
    provider: appnz-qwen
    provider_model_id: "qwen3.8-27b-uncensored"
    input_price_per_1m: 0.50
    output_price_per_1m: 4.50
    aliases: ["qwen3.8-27b-uncensored", "qwen-27b-uncensored", "appnz-qwen"]
    context_window: 32768
    max_output_tokens: 32768
    supports_streaming: true
    supports_tools: true
    supports_vision: false

  # --- OpenPaths Auto (hero + variants; embedding-routed) ---
  - id: "openpaths/auto"
    provider: google
    provider_model_id: "gemini-3.7-flash"
    input_price_per_1m: 0.375
    output_price_per_1m: 1.875
    aliases: ["auto", "auto-chat", "auto-text", "openpaths-auto"]
    context_window: 1000000
    max_output_tokens: 64000
    supports_streaming: true
    supports_tools: true
    supports_vision: true
    fallback_models:
      - "gpt-5.5"
      - "deepseek-v4-pro"
      - "gpt-5-chat-latest"
      - "deepseek-v4-flash"
      - "deepseek-chat"
      - "claude-sonnet-5"
      - "grok-4.6"
      - "gemini-2.5-pro"
      - "or/gpt-5.5"

  # Cheap default for ordinary chat; hard coding/math/science prompts can
  # escalate through the fallback chain without making every chat expensive.
  - id: "openpaths/chat-latest"
    provider: openrouter
    provider_model_id: "inclusionai/ling-3.0-flash"
    input_price_per_1m: 0.05
    output_price_per_1m: 0.25
    aliases: ["chat-latest", "openpaths-chat-latest"]
    context_window: 32768
    max_output_tokens: 8192
    supports_streaming: true
    supports_tools: true
    supports_vision: false
    fallback_models:
      - "openpaths/auto-fast"
      - "deepseek-v4-flash"

  # Free OpenRouter stealth route. Keep DeepSeek Flash as the first fallback
  # because the upstream stealth model can disappear or temporarily reject
  # requests without notice. Upstream reasoning is mandatory: effort "none"
  # returns 400, so the autorouter never routes here with thinking disabled
  # and direct calls default to xhigh (free model, no cost to thinking).
  - id: "openpaths/stealth/ox-alpha"
    provider: openrouter
    provider_model_id: "stealth/ox-alpha"
    input_price_per_1m: 0
    output_price_per_1m: 0
    aliases: ["stealth/ox-alpha", "ox-alpha", "openpaths-ox-alpha", "openpaths/ox-alpha"]
    context_window: 1000000
    max_output_tokens: 32768
    supports_streaming: true
    supports_tools: true
    supports_vision: false
    default_reasoning_effort: "xhigh"
    fallback_models:
      - "deepseek-v4-flash"

  - id: "openpaths/auto-cheap"
    provider: openai
    provider_model_id: "gpt-5.6-luna"
    input_price_per_1m: 0.20
    output_price_per_1m: 1.20
    aliases: ["auto-cheap", "auto-easy-task", "auto-easy", "openpaths-auto-cheap"]
    context_window: 400000
    max_output_tokens: 128000
    supports_streaming: true
    supports_tools: true
    supports_vision: true
    fallback_models:
      - "gemini-3.1-flash-lite"
      - "deepseek-v4-flash"
      - "gpt-4o-mini"
      - "claude-haiku-4-5-20251001"
      - "or/gpt-5.4-nano"

  - id: "openpaths/auto-fast"
    provider: deepseek
    provider_model_id: "deepseek-v4-flash"
    input_price_per_1m: 0.14
    output_price_per_1m: 0.28
